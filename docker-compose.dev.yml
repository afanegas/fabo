# Lokale Testumgebung: ohne Traefik und ohne BasicAuth, nur auf diesem Rechner erreichbar.
#
# Start:  docker compose -f docker-compose.dev.yml up --build
# Aufruf: http://localhost:8080
# Stop:   Strg+C, danach  docker compose -f docker-compose.dev.yml down

services:
  cabo:
    build: .
    image: cabo:dev
    container_name: cabo-dev
    environment:
      - TZ=Europe/Berlin
    ports:
      - "127.0.0.1:8080:8080"
    # Eigener Ordner, damit Testdaten nie mit echten Championship-Daten vermischt werden
    volumes:
      - ./data-dev:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
