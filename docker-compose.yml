# Cabo hinter Traefik 3 (läuft separat, Netzwerk "traefik_proxy").
# Alle persönlichen Werte (Domain, Passwort-Hash) stehen in der .env – siehe .env.example.
#
# Start / Update:  git pull && docker compose up -d --build

services:
  cabo:
    build: .
    image: cabo:local
    container_name: cabo
    environment:
      - TZ=Europe/Berlin
    # Laufende Partien liegen nur im Arbeitsspeicher. ./data enthält die
    # Championship-Statistik (championship.json + Sicherungen vor jedem Reset).
    # Einmalig auf dem Server:  mkdir -p data && sudo chown 1000:1000 data
    volumes:
      - ./data:/data
    networks:
      - traefik_proxy
    restart: unless-stopped

    # Nicht per ports: veröffentlichen – ohne Traefik davor wäre das Spiel ohne Passwort
    # erreichbar. Zum Testen nur lokal:  - "127.0.0.1:8080:8080"

    # ---------- Absicherung des Containers ----------
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cabo.rule=Host(`${CABO_DOMAIN}`)"
      - "traefik.http.routers.cabo.entrypoints=websecure"
      - "traefik.http.routers.cabo.tls=true"
      - "traefik.http.routers.cabo.tls.certresolver=le"
      - "traefik.http.routers.cabo.middlewares=cabo-auth,cabo-headers"
      - "traefik.http.routers.cabo.service=cabo"
      - "traefik.http.middlewares.cabo-auth.basicauth.users=${CABO_BASIC_AUTH}"
      # HSTS: nur Traefik weiß von TLS. Ohne includeSubdomains.
      - "traefik.http.middlewares.cabo-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.cabo-headers.headers.stsIncludeSubdomains=false"
      - "traefik.http.services.cabo.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik_proxy"

networks:
  traefik_proxy:
    external: true
